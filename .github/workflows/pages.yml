# Deploy the static marketing site in website/ to GitHub Pages.
# Uses the official Pages Actions flow (no branch juggling).
# After merge: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy website to Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check documentation and public boundary
        run: python3 tools/check_docs.py
      - name: Stage public site without private packages
        run: |
          mkdir .public-site
          rsync -a \
            --exclude 'downloads/' \
            --exclude '*.apk' --exclude '*.aab' --exclude '*.zip' \
            --exclude '*.dmg' --exclude '*.ipa' --exclude '*.exe' --exclude '*.msi' \
            --exclude '.env*' --exclude '*.key' --exclude '*.pem' --exclude '*.pfx' \
            website/ .public-site/
          python3 tools/check_docs.py --public-root .public-site
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
