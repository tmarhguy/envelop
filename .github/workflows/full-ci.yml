name: Full CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-web-backend-protocol:
    name: Source, web, backend, and protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/testing/package-lock.json
      - name: Install backend test dependencies
        run: npm ci --prefix tools/testing
      - name: Run website tests
        run: node --test website/chat/*.test.cjs website/chat/*.test.mjs website/chat/virtual/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find website backend -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
      - name: Check documentation and public artifact
        run: |
          python3 tools/check_docs.py
          mkdir .public-site
          rsync -a \
            --exclude 'downloads/' \
            --exclude '*.test.js' --exclude '*.test.mjs' --exclude '*.test.cjs' \
            --exclude '*.apk' --exclude '*.aab' --exclude '*.zip' \
            --exclude '*.dmg' --exclude '*.ipa' --exclude '*.exe' --exclude '*.msi' \
            --exclude '.env*' --exclude '*.key' --exclude '*.pem' --exclude '*.pfx' \
            website/ .public-site/
          python3 tools/check_docs.py --public-root .public-site
      - name: Run backend PGlite tests
        run: node backend/tests.mjs
      - name: Verify protocol vectors
        run: python3 protocol/test-vectors/verify_c.py

  android:
    name: Android JDK 17 tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run unit tests and lint
        working-directory: android
        run: ./gradlew test lint

  macos:
    name: macOS Swift tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Swift tests
        run: swift test --package-path apple
